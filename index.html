<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Classical Conditioning Lab</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; max-width: 850px; margin: 1.5rem auto; padding: 0 1rem; background-color: #f8fafc; color: #1e293b; }
    h2 { text-align: center; color: #0f172a; margin-bottom: 0.25rem; }
    .subtitle { text-align: center; color: #64748b; font-size: 0.95rem; margin-bottom: 1.5rem; }

    .card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 1.5rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }

    /* --- STIMULUS INVENTORY (DRAGGABLE AREA) --- */
    .inventory-title { font-weight: 700; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; color: #475569; margin-bottom: 0.5rem; text-align: center; }
    .stimulus-rack { display: flex; justify-content: center; gap: 1.5rem; margin-bottom: 1.5rem; }
    
    .draggable-item {
      width: 110px; height: 110px; background: #f1f5f9; border: 2px solid #cbd5e1; border-radius: 12px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      cursor: grab; user-select: none; transition: all 0.2s ease;
    }
    .draggable-item:hover { border-color: #3b82f6; background: #eff6ff; transform: translateY(-2px); }
    .draggable-item:active { cursor: grabbing; transform: scale(0.95); }
    .draggable-item svg { width: 48px; height: 48px; pointer-events: none; }
    .item-label { font-size: 0.75rem; font-weight: 700; color: #334155; margin-top: 0.4rem; pointer-events: none; }

    /* --- THE LAB STAGE & DROP ZONE --- */
    .lab-stage { display: flex; flex-direction: column; align-items: center; background: #fafafa; border: 2px dashed #cbd5e1; border-radius: 12px; padding: 1.5rem; position: relative; margin-bottom: 1.5rem; }
    
    .subject-area { position: relative; text-align: center; margin-bottom: 1rem; }
    .dog-svg { width: 130px; height: 130px; }
    
    /* Drool Puddle */
    .drool-svg { position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%) scale(0); width: 40px; height: 40px; transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); opacity: 0; }
    .drool-svg.active { opacity: 1; }

    /* Drop Zone Tray */
    .drop-tray {
      width: 100%; max-width: 360px; height: 100px; background: #ffffff; border: 2px dashed #94a3b8; border-radius: 10px;
      display: flex; align-items: center; justify-content: center; gap: 1rem; position: relative; transition: all 0.2s ease;
    }
    .drop-tray.drag-over { border-color: #2563eb; background: #eff6ff; }
    .drop-placeholder { color: #94a3b8; font-size: 0.85rem; font-weight: 500; pointer-events: none; text-align: center; padding: 0 1rem; }

    .tray-item { width: 70px; height: 70px; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; animation: popIn 0.2s ease; }
    .tray-item svg { width: 36px; height: 36px; }

    /* --- ACTION BUTTONS & METERS --- */
    .action-bar { display: flex; justify-content: center; gap: 0.75rem; margin-top: 1rem; }
    button { padding: 0.6rem 1.2rem; border: none; border-radius: 6px; font-weight: 600; font-size: 0.85rem; cursor: pointer; transition: all 0.2s; }
    .btn-primary { background: #2563eb; color: white; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-secondary { background: #e2e8f0; color: #334155; }
    .btn-secondary:hover { background: #cbd5e1; }
    .btn-reset { background: #ef4444; color: white; margin-left: auto; }
    .btn-reset:hover { background: #dc2626; }

    .meter-section { margin: 1.5rem 0; }
    .meter-label { font-size: 0.85rem; font-weight: 700; color: #475569; display: flex; justify-content: space-between; margin-bottom: 0.4rem; }
    .meter-bg { background: #e2e8f0; height: 20px; border-radius: 10px; overflow: hidden; }
    .meter-fill { background: #2563eb; height: 100%; width: 0%; transition: width 0.3s ease; }

    .log-box { background: #0f172a; color: #38bdf8; font-family: ui-monospace, monospace; font-size: 0.8rem; height: 120px; overflow-y: auto; padding: 0.75rem; border-radius: 6px; line-height: 1.4; }

    @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    @keyframes bellRing { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(15deg); } 75% { transform: rotate(-15deg); } }
    .ringing { animation: bellRing 0.2s ease infinite; }
  </style>
</head>
<body>

  <h2>Classical Conditioning Lab</h2>
  <div class="subtitle">Drag stimuli into the presentation tray to train the subject.</div>

  <div class="card">
    
    <!-- STIMULUS SELECTION -->
    <div class="inventory-title">Available Stimuli</div>
    <div class="stimulus-rack">
      <!-- Bell (CS) -->
      <div class="draggable-item" draggable="true" id="drag-cs" data-type="cs">
        <svg id="bell-icon" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path>
          <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path>
        </svg>
        <span class="item-label">Bell (CS)</span>
      </div>

      <!-- Food (UCS) -->
      <div class="draggable-item" draggable="true" id="drag-ucs" data-type="ucs">
        <svg viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 21a9 9 0 0 0 9-9H3a9 9 0 0 0 9 9Z"></path>
          <path d="M7 12V7a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v5"></path>
          <circle cx="12" cy="16" r="1.5" fill="#dc2626"></circle>
        </svg>
        <span class="item-label">Food Bowl (UCS)</span>
      </div>
    </div>

    <!-- MAIN LAB STAGE -->
    <div class="lab-stage">
      <div class="subject-area">
        <!-- Dog SVG -->
        <svg class="dog-svg" viewBox="0 0 64 64" fill="none">
          <path d="M16 24C16 16 22 10 32 10C42 10 48 16 48 24V38C48 44 42 50 32 50C22 50 16 44 16 38V24Z" fill="#94a3b8"/>
          <circle cx="24" cy="24" r="3" fill="#0f172a"/>
          <circle cx="40" cy="24" r="3" fill="#0f172a"/>
          <ellipse cx="32" cy="32" rx="5" ry="3" fill="#0f172a"/>
          <path d="M12 20C10 24 10 32 14 36" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
          <path d="M52 20C54 24 54 32 50 36" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
        </svg>
        <!-- Drool Puddle SVG -->
        <svg id="drool-icon" class="drool-svg" viewBox="0 0 24 24" fill="#38bdf8">
          <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>
        </svg>
      </div>

      <!-- Presentation Drop Tray -->
      <div class="drop-tray" id="drop-tray">
        <div class="drop-placeholder" id="tray-placeholder">Drag Bell and/or Food here</div>
      </div>

      <!-- Actions -->
      <div class="action-bar">
        <button class="btn-primary" id="btn-present" onclick="presentStimuli()">Present to Subject</button>
        <button class="btn-secondary" onclick="clearTray()">Clear Tray</button>
        <button class="btn-reset" onclick="resetLab()">Reset Lab</button>
      </div>
    </div>

    <!-- METER & LOG -->
    <div class="meter-section">
      <div class="meter-label">
        <span>Association Strength (CS &rarr; UCS)</span>
        <span id="strength-val">0%</span>
      </div>
      <div class="meter-bg">
        <div id="meter-fill" class="meter-fill"></div>
      </div>
    </div>

    <strong>Event Log:</strong>
    <div id="log" class="log-box"></div>
  </div>

  <script>
    let V = 0.0; // Association strength (0.0 to 1.0)
    const k = 0.25; // Learning rate
    let trayItems = new Set();

    const tray = document.getElementById('drop-tray');
    const placeholder = document.getElementById('tray-placeholder');
    const bellIcon = document.getElementById('bell-icon');
    const droolIcon = document.getElementById('drool-icon');

    // Setup Drag and Drop Event Handlers
    document.querySelectorAll('.draggable-item').forEach(item => {
      item.addEventListener('dragstart', (e) => {
        e.dataTransfer.setData('text/plain', item.dataset.type);
      });
    });

    tray.addEventListener('dragover', (e) => {
      e.preventDefault();
      tray.classList.add('drag-over');
    });

    tray.addEventListener('dragleave', () => {
      tray.classList.remove('drag-over');
    });

    tray.addEventListener('drop', (e) => {
      e.preventDefault();
      tray.classList.remove('drag-over');
      const itemType = e.dataTransfer.getData('text/plain');
      if (itemType) {
        addItemToTray(itemType);
      }
    });

    function addItemToTray(type) {
      if (trayItems.has(type)) return; // Prevent duplicate additions
      
      trayItems.add(type);
      placeholder.style.display = 'none';

      const itemEl = document.createElement('div');
      itemEl.className = 'tray-item';
      itemEl.id = `tray-${type}`;

      if (type === 'cs') {
        itemEl.innerHTML = `
          <svg viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2">
            <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path>
            <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path>
          </svg>
        `;
      } else if (type === 'ucs') {
        itemEl.innerHTML = `
          <svg viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2">
            <path d="M12 21a9 9 0 0 0 9-9H3a9 9 0 0 0 9 9Z"></path>
            <path d="M7 12V7a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v5"></path>
            <circle cx="12" cy="16" r="1.5" fill="#dc2626"></circle>
          </svg>
        `;
      }

      tray.appendChild(itemEl);
    }

    function clearTray() {
      trayItems.clear();
      document.querySelectorAll('.tray-item').forEach(el => el.remove());
      placeholder.style.display = 'block';
      droolIcon.classList.remove('active');
      bellIcon.classList.remove('ringing');
    }

    function presentStimuli() {
      if (trayItems.size === 0) {
        logEvent("Tray is empty! Drag Bell or Food into the tray first.");
        return;
      }

      const hasCS = trayItems.has('cs');
      const hasUCS = trayItems.has('ucs');

      if (hasCS) bellIcon.classList.add('ringing');

      if (hasCS && hasUCS) {
        // Paired Trial (Acquisition)
        V = V + k * (1.0 - V);
        showDrool(1.0);
        logEvent(`[PAIRED TRIAL] Bell rang + Food presented. Bell association rose to ${Math.round(V * 100)}%. Subject salivates (UCR).`);
      } else if (hasCS && !hasUCS) {
        // CS Alone (Extinction)
        const currentCR = V;
        V = V + k * (0.0 - V); // Decrease association
        showDrool(currentCR);
        logEvent(`[CS ALONE] Bell rang. Salivation strength: ${Math.round(currentCR * 100)}%. Association dropped to ${Math.round(V * 100)}% (Extinction).`);
      } else if (!hasCS && hasUCS) {
        // UCS Alone
        showDrool(1.0);
        logEvent(`[UCS ALONE] Food presented. Subject salivates 100% (UCR). No change to Bell association.`);
      }

      updateUI();
      setTimeout(() => {
        bellIcon.classList.remove('ringing');
      }, 1000);
    }

    function showDrool(intensity) {
      if (intensity > 0.05) {
        droolIcon.classList.add('active');
        droolIcon.style.transform = `translateX(-50%) scale(${0.5 + intensity * 0.8})`;
      } else {
        droolIcon.classList.remove('active');
      }
    }

    function updateUI() {
      const pct = Math.round(V * 100);
      document.getElementById('strength-val').innerText = pct + '%';
      document.getElementById('meter-fill').style.width = pct + '%';
    }

    function logEvent(msg) {
      const log = document.getElementById('log');
      log.innerHTML = `> ${msg}<br>` + log.innerHTML;
    }

    function resetLab() {
      V = 0.0;
      clearTray();
      document.getElementById('log').innerHTML = '';
      logEvent('Lab reset. Subject unconditioned.');
      updateUI();
    }

    // Initial setup
    logEvent("Ready. Drag stimuli into the tray to begin testing.");
  </script>
</body>
</html>
