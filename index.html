<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Classical Conditioning Lab</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 650px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
    .card { border: 1px solid #ccc; border-radius: 8px; padding: 1.5rem; background: #f9f9f9; }
    .meter-container { background: #eee; height: 24px; border-radius: 12px; overflow: hidden; margin: 1rem 0; }
    .meter-fill { background: #2563eb; height: 100%; width: 0%; transition: width 0.3s ease; }
    .button-group { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1rem; }
    button { padding: 0.6rem 1rem; border: none; border-radius: 4px; background: #2563eb; color: white; cursor: pointer; font-weight: bold; }
    button:hover { background: #1d4ed8; }
    button.secondary { background: #6b7280; }
    button.secondary:hover { background: #4b5563; }
    .log-box { background: #fff; border: 1px solid #ddd; height: 150px; overflow-y: auto; padding: 0.5rem; font-family: monospace; font-size: 0.9rem; }
  </style>
</head>
<body>

  <h2>Classical Conditioning Sandbox</h2>
  <div class="card">
    <div><strong>Conditioned Response (Salivation) Strength:</strong> <span id="strength-val">0%</span></div>
    <div class="meter-container">
      <div id="meter-fill" class="meter-fill"></div>
    </div>

    <div class="button-group">
      <button onclick="runTrial('pair')">Pair Bell + Food (Acquisition)</button>
      <button onclick="runTrial('cs')" class="secondary">Ring Bell Alone (CS)</button>
      <button onclick="runTrial('ucs')" class="secondary">Present Food Alone (UCS)</button>
      <button onclick="resetLab()" class="secondary" style="background:#dc2626;">Reset Lab</button>
    </div>

    <strong>Event Log:</strong>
    <div id="log" class="log-box"></div>
  </div>

  <script>
    let V = 0.0; // Association Strength (0.0 to 1.0)
    const k = 0.25; // Learning rate

    function updateUI() {
      const pct = Math.round(V * 100);
      document.getElementById('strength-val').innerText = pct + '%';
      document.getElementById('meter-fill').style.width = pct + '%';
    }

    function logEvent(msg) {
      const log = document.getElementById('log');
      log.innerHTML = `> ${msg}<br>` + log.innerHTML;
    }

    function runTrial(type) {
      if (type === 'pair') {
        V = V + k * (1.0 - V);
        logEvent(`[PAIRED TRIAL] Bell rang + Food presented. Bell association rose to ${Math.round(V*100)}%. Subject salivates (UCR).`);
      } else if (type === 'cs') {
        const salivation = Math.round(V * 100);
        V = V + k * (0.0 - V); // Extinction step
        logEvent(`[CS ALONE] Bell rang. Salivation output: ${salivation}%. Association dropped to ${Math.round(V*100)}% (Extinction).`);
      } else if (type === 'ucs') {
        logEvent(`[UCS ALONE] Food presented. Subject salivates 100% (UCR). No effect on Bell association.`);
      }
      updateUI();
    }

    function resetLab() {
      V = 0.0;
      document.getElementById('log').innerHTML = '';
      logEvent('Lab reset. Subject unconditioned.');
      updateUI();
    }
  </script>
</body>
</html>
